<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --border: #e4e7ee;
      --text: #1a1d29;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --accent-soft: #eef2ff;
      --success: #059669;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 56px 24px 80px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    header { margin-bottom: 28px; }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-top: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .form-row .field { flex: 1; }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]::placeholder { color: #a3a7b3; }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      margin-top: 22px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      white-space: nowrap;
    }

    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }

    #result {
      margin-top: 16px;
      white-space: pre-wrap;
      background: var(--accent-soft);
      color: var(--accent-dark);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      min-height: 20px;
    }

    #result:empty { display: none; }

    .table-wrap {
      margin-top: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    thead th {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #fafbfd;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }

    td.price { font-weight: 600; color: var(--success); }

    td.actions { text-align: right; width: 1%; white-space: nowrap; }

    .btn-delete {
      margin-top: 0;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-delete:hover { background: #fee2e2; border-color: #fca5a5; }
    .btn-delete:disabled { opacity: 0.5; cursor: default; }

    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 24px 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>
  </header>

  <form id="stock-form" class="card">
    <div class="form-row">
      <div class="field">
        <label for="symbol">Ticker symbol</label>
        <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      </div>
      <button type="submit">Add to watchlist</button>
    </div>
  </form>

  <div id="result"></div>

  <div class="table-wrap">
    <table id="watchlist-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Email</th>
          <th>Latest price</th>
          <th>Updated</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="watchlist-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";

        if (!data.length) {
          const emptyTr = document.createElement("tr");
          emptyTr.className = "empty-row";
          emptyTr.innerHTML = `<td colspan="5">Your watchlist is empty. Add a ticker above to get started.</td>`;
          watchlistBody.appendChild(emptyTr);
          return;
        }

        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td class="price">${price}</td><td>${updated}</td>` +
            `<td class="actions"><button type="button" class="btn-delete" data-symbol="${row.symbol}">Remove</button></td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    async function deleteSymbol(symbol, button) {
      button.disabled = true;
      button.textContent = "Removing...";
      resultEl.textContent = "";

      try {
        const resp = await fetch(`/watchlist/${encodeURIComponent(symbol)}`, {
          method: "DELETE",
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          button.disabled = false;
          button.textContent = "Remove";
          return;
        }
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Failed to remove " + symbol + ": " + err;
        button.disabled = false;
        button.textContent = "Remove";
      }
    }

    watchlistBody.addEventListener("click", (e) => {
      const button = e.target.closest(".btn-delete");
      if (!button) return;
      const symbol = button.dataset.symbol;
      deleteSymbol(symbol, button);
    });

    loadWatchlist();
  </script>
</body>
</html>
